[package]
name = "knowledgekeeperclient"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "knowledgekeeperclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-stronghold = "2.3.1"
iota_stronghold = "2.1.0"
reqwest = {version = "0.13.4", features = ["json"] }
thiserror = "2"

# Optimise les dépendances (dont Argon2/Stronghold) même en build dev.
# Sans ça, la dérivation de clé au démarrage est extrêmement lente en dev.
# Ton propre crate reste non-optimisé (recompilation rapide quand tu édites).
[profile.dev.package."*"]
opt-level = 3
